# ==============================================================================
# CCE Compliance Service — Application Configuration
# ==============================================================================

server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: cce-compliance-service

  # --- DataSource ---
  # Shared ccedb. DB_PORT defaults to the standard 5432; set it to 5433 to reach the instance
  # deployed by cce-collector-service.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ccedb}
    username: ${DB_USERNAME:cce_user}
    password: ${DB_PASSWORD:cce_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # --- Flyway ---
  # This service owns no tables. The Matcher Service's migration creates step_instance,
  # step_sla_state_transition, deviation and intelligence_event_log; the Protocol Service's creates
  # protocol_definition, action_definition and trigger_index. Enabling Flyway here would
  # only add an empty ledger and invite a second service to start writing DDL for tables it does not own.
  flyway:
    enabled: false

  # --- Kafka ---
  # Produce-only. This service consumes nothing, so there is no consumer or listener configuration
  # here and KafkaConfig declares no listener container factory.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

# --- Custom Kafka Topics ---
cce:
  kafka:
    topics:
      intelligence-triggers: cce.intelligence.triggers
      default-partitions: 25
    # No cce.kafka.retry.* here: retry and DLQ settings govern a consumer, and this service has none.
  protocol:
    # Read by the shared ParsedProtocolCache, which intelligence evaluation uses to resolve a step's
    # metadata from its protocol definition.
    parsed-cache-size: ${CCE_PARSED_PROTOCOL_CACHE_SIZE:256}
  intelligence:
    # How long to wait for Kafka to acknowledge an intelligence trigger before recording it unpublished
    publish-confirm-timeout-ms: ${CCE_PUBLISH_CONFIRM_TIMEOUT_MS:5000}
  sla:
    # The evaluator fetches step_sla_state_transition rows with FOR UPDATE SKIP LOCKED, so every replica
    # can poll concurrently. This interval is the steady-state cost — one empty fetch query per tick; a
    # backlog is drained within a single cycle rather than one batch per tick.
    poll-interval-ms: ${CCE_SLA_POLL_INTERVAL_MS:5000}
    batch-size: ${CCE_SLA_BATCH_SIZE:100}
    # Recorded in processed_by, so each row says which replica applied it.
    instance-id: ${CCE_SLA_INSTANCE_ID:${HOSTNAME:local}}
    # Cap on the exponential retry backoff for a row that keeps failing.
    max-backoff-seconds: ${CCE_SLA_MAX_BACKOFF_SECONDS:3600}

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: cce-compliance-service

# --- Logging ---
logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.hibernate: WARN
    org.openphc.cce.compliance: INFO

