name: SonarQube

on:
  push:
    # Pattern, not a fixed list: release-1.0.0, release-2.0.0 and any future
    # release line are covered without editing this file. Case-sensitive.
    # 'main' is the repository default branch and is listed so pushes there are
    # not silently skipped, even though the release lines carry the work.
    branches:
      - main
      - 'release-*'
  # NOTE: PRs opened from a fork do not receive repository/org secrets, so
  # SONAR_TOKEN is empty there. Those runs still build and produce coverage,
  # but skip the Sonar upload (see the guarded steps below); analysis lands on
  # the push to the release line after the PR is merged into openphc.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Two checkouts, laid out as siblings. settings.gradle declares
      # includeBuild '../cce-common-util', so a single checkout fails at
      # configuration time with "Included build ... does not exist" — the same
      # trap the Dockerfile documents for its build context.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: cce-compliance-service
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # Build against the library's matching release line, not its default branch:
      # the 2.0.0 API lives on release-2.0.0, and analysing this service against
      # main would compile it against a different library than the branch uses.
      # Falls back to main when the line does not exist there yet.
      - name: Resolve the cce-common-util branch to build against
        id: lib
        env:
          LINE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads \
               https://github.com/openphc/cce-common-util.git "$LINE" >/dev/null 2>&1; then
            echo "ref=$LINE" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "::notice::cce-common-util has no '$LINE' branch — building against main"
          fi

      # Shallow on purpose: this checkout is a build input, not the analysis
      # subject, so Sonar's blame data does not depend on its history.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: openphc/cce-common-util
          ref: ${{ steps.lib.outputs.ref }}
          path: cce-common-util

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21   # build.gradle pins the toolchain to 21
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # The key spans both checkouts, so a change to either build file invalidates it.
      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      # The scanner does NOT infer the branch from the CI environment, so it must
      # be passed explicitly. Without this every branch uploads as the project's
      # main branch and overwrites the previous line's results.
      - name: Build and analyze
        if: env.SONAR_TOKEN != ''
        working-directory: cce-compliance-service
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_KEY: ${{ github.event.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            set -- -Dsonar.pullrequest.key="$PR_KEY" \
                   -Dsonar.pullrequest.branch="$PR_BRANCH" \
                   -Dsonar.pullrequest.base="$PR_BASE"
          else
            set -- -Dsonar.branch.name="$BRANCH"
          fi
          ./gradlew build jacocoTestReport sonar --info "$@"

      # Fork PRs get no secrets: still build and run tests so the check is
      # meaningful, but do not attempt an unauthenticated Sonar upload.
      - name: Build without analysis (SONAR_TOKEN unavailable)
        if: env.SONAR_TOKEN == ''
        working-directory: cce-compliance-service
        run: ./gradlew build jacocoTestReport
